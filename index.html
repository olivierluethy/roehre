<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Röhre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Oswald:wght@500;700&display=swap">
<style>
  :root{
    --room:#08090f;
    --room2:#12141f;
    --shell-a:#2a2620;
    --shell-b:#171512;
    --shell-edge:#3d3830;
    --graphite:#1a1a1e;
    --cyan:#35e0e0;
    --amber:#ffb454;
    --green:#46e07a;
    --red:#ff4d4d;
    --glow: #35e0e0;
    --mono:'VT323', ui-monospace, 'Courier New', monospace;
    --sans:'Oswald', system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(120% 90% at 50% 8%, rgba(53,224,224,0.05), transparent 55%),
      radial-gradient(140% 120% at 50% 120%, #05060a 0%, var(--room2) 40%, var(--room) 100%);
    color:#e8e8ea;
    font-family:var(--sans);
    overflow:hidden;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    user-select:none;
    touch-action:manipulation;
  }
  /* ambient light the TV casts on the room, tinted per channel */
  #ambient{
    position:fixed; inset:-10%;
    background:radial-gradient(45% 40% at 50% 42%, var(--glow), transparent 70%);
    opacity:0; filter:blur(60px);
    transition:opacity .6s ease, background 1.2s ease;
    pointer-events:none; z-index:0;
  }
  #ambient.on{opacity:.28}

  .stage{
    position:relative; z-index:2;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    gap:clamp(14px,3vw,54px);
    padding:clamp(14px,3vw,40px);
    flex-wrap:wrap;
  }

  /* ---------------- TV SET ---------------- */
  .tv{
    position:relative;
    width:min(78vw, 62vh * 1.34, 860px);
    aspect-ratio:1.34/1;
    border-radius:38px;
    padding:clamp(20px,3.2vw,46px);
    background:
      linear-gradient(150deg, var(--shell-a), var(--shell-b) 70%);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.06),
      inset 0 -8px 24px rgba(0,0,0,.7),
      0 40px 80px -20px rgba(0,0,0,.9),
      0 8px 30px rgba(0,0,0,.6);
    border:1px solid var(--shell-edge);
    display:grid;
    grid-template-columns:1fr 92px;
    gap:clamp(14px,2vw,26px);
    transition:box-shadow .6s ease;
  }
  .tv.warm{
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.06),
      inset 0 -8px 24px rgba(0,0,0,.7),
      0 40px 90px -18px rgba(0,0,0,.9),
      0 0 90px -10px var(--glow),
      0 8px 30px rgba(0,0,0,.6);
  }

  /* subtle wood/plastic grain */
  .tv::before{
    content:""; position:absolute; inset:0; border-radius:38px; pointer-events:none;
    background:repeating-linear-gradient(92deg, rgba(255,255,255,.015) 0 2px, transparent 2px 7px);
    mix-blend-mode:overlay; opacity:.5;
  }

  .screen-wrap{ position:relative; }

  /* the glass / tube */
  .screen{
    position:relative;
    width:100%; aspect-ratio:4/3;
    border-radius:8% / 11%;
    overflow:hidden;
    background:#000;
    box-shadow:
      inset 0 0 0 3px #05060a,
      inset 0 0 14px 8px rgba(0,0,0,.9),
      inset 0 0 60px 10px rgba(0,0,0,.55);
    outline:6px solid #0b0c10;
    outline-offset:-2px;
  }
  #tube{
    position:absolute; inset:0; width:100%; height:100%;
    display:block;
    /* barrel-ish curvature */
    transform:scale(1.012);
    filter:saturate(1.12) contrast(1.06) brightness(1.02);
    image-rendering:auto;
    opacity:0;
    transition:opacity .05s;
  }
  .screen.lit #tube{opacity:1}

  /* scanlines */
  .fx-scan{
    position:absolute; inset:0; pointer-events:none; z-index:5;
    background:
      repeating-linear-gradient(to bottom,
        rgba(0,0,0,0) 0px,
        rgba(0,0,0,0) 2px,
        rgba(0,0,0,.20) 3px,
        rgba(0,0,0,.20) 3px);
    mix-blend-mode:multiply; opacity:.55;
  }
  /* shadow mask (subtle rgb) */
  .fx-mask{
    position:absolute; inset:0; pointer-events:none; z-index:5;
    background:repeating-linear-gradient(90deg,
      rgba(255,0,0,.06) 0 1px, rgba(0,255,0,.06) 1px 2px, rgba(0,0,255,.06) 2px 3px);
    mix-blend-mode:screen; opacity:.35;
  }
  /* rolling brightness bar */
  .fx-roll{
    position:absolute; left:0; right:0; height:40%; z-index:6; pointer-events:none;
    background:linear-gradient(to bottom, transparent, rgba(255,255,255,.05), transparent);
    animation:roll 7s linear infinite; opacity:.6;
  }
  @keyframes roll{ 0%{top:-40%} 100%{top:100%} }
  /* glass glare + vignette */
  .fx-glass{
    position:absolute; inset:0; pointer-events:none; z-index:7;
    background:
      radial-gradient(80% 55% at 28% 18%, rgba(255,255,255,.10), transparent 55%),
      radial-gradient(120% 120% at 50% 50%, transparent 58%, rgba(0,0,0,.55) 100%);
  }
  /* flicker */
  .fx-flicker{
    position:absolute; inset:0; pointer-events:none; z-index:6; background:#000; opacity:0;
    animation:flick 5s steps(1) infinite;
  }
  @keyframes flick{
    0%,7%,9%,100%{opacity:0} 8%{opacity:.06} 43%{opacity:0} 44%{opacity:.05} 45%{opacity:0}
  }

  /* CRT power on/off transition overlay */
  .fx-power{ position:absolute; inset:0; z-index:9; pointer-events:none; background:transparent; }
  .fx-power .line{
    position:absolute; left:0; right:0; top:50%; height:2px;
    background:#fff; box-shadow:0 0 22px 8px #fff; transform:translateY(-50%) scaleX(1);
    opacity:0;
  }
  .screen.turning-on .fx-power{ animation:powScreen .55s ease forwards; }
  .screen.turning-on .fx-power .line{ animation:powLine .55s ease forwards; }
  @keyframes powLine{
    0%{opacity:1; height:2px; width:2px; left:50%; right:auto; transform:translate(-50%,-50%)}
    35%{opacity:1; height:2px; width:100%; left:0; transform:translate(0,-50%)}
    60%{opacity:1; height:100%; top:0; transform:none}
    100%{opacity:0; height:100%; top:0; transform:none}
  }
  @keyframes powScreen{ 0%{background:#000} 55%{background:#fff} 100%{background:transparent} }

  .screen.turning-off .fx-power{ animation:powOff .45s ease forwards; background:#000; }
  .screen.turning-off .fx-power .line{ animation:powOffLine .45s ease forwards; }
  @keyframes powOff{ 0%{background:transparent} 30%{background:rgba(255,255,255,.4)} 100%{background:#000} }
  @keyframes powOffLine{
    0%{opacity:0} 25%{opacity:1; height:100%; width:100%; top:0; left:0; transform:none}
    70%{opacity:1; height:3px; width:100%; top:50%; left:0; transform:translateY(-50%)}
    100%{opacity:1; height:3px; width:3px; top:50%; left:50%; transform:translate(-50%,-50%); box-shadow:0 0 30px 12px #fff}
  }

  /* OSD ------------------------------------ */
  .osd{ position:absolute; inset:0; z-index:8; pointer-events:none; font-family:var(--mono); }
  .osd .chan{
    position:absolute; top:5%; left:6%;
    color:var(--cyan); text-shadow:0 0 8px currentColor;
    font-size:clamp(22px,5.5vw,54px); line-height:.9;
    opacity:0; transition:opacity .35s;
  }
  .osd .chan .num{ font-size:1.55em; display:block; }
  .osd .chan .name{ font-size:.7em; letter-spacing:1px; }
  .osd .chan.show{opacity:1}

  .osd .entry{
    position:absolute; top:5%; right:6%;
    color:var(--amber); text-shadow:0 0 8px currentColor;
    font-size:clamp(26px,6vw,60px); letter-spacing:4px;
    opacity:0; transition:opacity .15s;
  }
  .osd .entry.show{opacity:1}

  .osd .clock{
    position:absolute; bottom:5%; right:6%;
    color:rgba(255,255,255,.7); font-size:clamp(14px,3vw,26px);
    text-shadow:0 0 6px rgba(0,0,0,.8);
    opacity:0; transition:opacity .35s;
  }
  .osd .clock.show{opacity:.85}

  .osd .vol{
    position:absolute; left:6%; right:6%; bottom:7%;
    display:flex; align-items:center; gap:10px;
    opacity:0; transition:opacity .35s;
  }
  .osd .vol.show{opacity:1}
  .osd .vol .lab{ color:#fff; font-size:clamp(14px,3.2vw,26px); text-shadow:0 0 6px #000; min-width:2.4em; }
  .osd .vol .bars{ display:flex; gap:3px; flex:1; }
  .osd .vol .bars i{ flex:1; height:clamp(10px,2.4vw,18px); background:rgba(255,255,255,.16); border-radius:2px; }
  .osd .vol .bars i.f{ background:var(--green); box-shadow:0 0 8px var(--green); }
  .osd .mute{
    position:absolute; left:6%; bottom:7%;
    color:var(--red); font-size:clamp(16px,3.4vw,28px); text-shadow:0 0 8px currentColor;
    opacity:0; transition:opacity .3s;
  }
  .osd .mute.show{opacity:1}

  /* standby hint */
  .standby{
    position:absolute; inset:0; z-index:8; display:grid; place-items:center;
    text-align:center; color:rgba(120,140,150,.5); font-family:var(--mono);
    transition:opacity .5s; padding:8%;
  }
  .standby .p{ font-size:clamp(16px,3.4vw,26px); letter-spacing:2px; }
  .standby .blink{ animation:blink 1.4s steps(1) infinite; color:var(--cyan); }
  @keyframes blink{ 50%{opacity:.15} }
  .screen.lit .standby{ opacity:0; }

  /* EPG guide overlay */
  .guide{
    position:absolute; inset:0; z-index:8; pointer-events:none;
    font-family:var(--mono); color:#dff;
    background:linear-gradient(180deg, rgba(2,10,20,.86), rgba(6,20,36,.9));
    padding:6% 6% 5%; opacity:0; transition:opacity .3s;
    display:flex; flex-direction:column;
  }
  .guide.show{opacity:1}
  .guide h3{
    margin:0 0 .3em; font-family:var(--mono); font-weight:400;
    color:var(--amber); text-shadow:0 0 8px currentColor;
    font-size:clamp(18px,4vw,34px); letter-spacing:2px;
  }
  .guide .rows{ display:flex; flex-direction:column; gap:2px; overflow:hidden; }
  .guide .row{
    display:flex; align-items:baseline; gap:.7em; padding:.15em .5em;
    font-size:clamp(13px,2.9vw,22px); border-radius:4px;
  }
  .guide .row .n{ color:var(--cyan); min-width:1.6em; text-align:right; }
  .guide .row .nm{ flex:1; }
  .guide .row .now{ color:rgba(200,230,240,.55); font-size:.82em; }
  .guide .row.cur{ background:var(--cyan); color:#012; }
  .guide .row.cur .n,.guide .row.cur .now{ color:#023; }

  /* ---------------- controls column (knobs / brand / speaker) ---------------- */
  .panel{
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    padding:4px 0;
  }
  .brand{
    font-family:var(--sans); font-weight:700; letter-spacing:3px; font-size:13px;
    color:#c9c2b4; text-shadow:0 1px 0 #000; writing-mode:vertical-rl; transform:rotate(180deg);
    opacity:.9;
  }
  .led{
    width:11px; height:11px; border-radius:50%;
    background:#3a0d0d; box-shadow:inset 0 0 4px #000;
    transition:background .4s, box-shadow .4s;
  }
  .led.on{ background:var(--green); box-shadow:0 0 12px 2px var(--green), inset 0 0 3px #0f5; }
  .knobs{ display:flex; flex-direction:column; gap:16px; align-items:center; }
  .knob{
    width:46px; height:46px; border-radius:50%; position:relative; cursor:pointer;
    background:radial-gradient(circle at 35% 30%, #4a463e, #17150f 70%);
    box-shadow:inset 0 2px 3px rgba(255,255,255,.12), 0 3px 6px rgba(0,0,0,.6);
    border:1px solid #0d0c09;
  }
  .knob::after{
    content:""; position:absolute; left:50%; top:6px; width:3px; height:15px;
    background:#d8cfae; border-radius:2px; transform:translateX(-50%);
    box-shadow:0 0 4px rgba(255,220,120,.5);
    transition:transform .2s;
  }
  .knob .cap{ position:absolute; left:50%; bottom:-15px; transform:translateX(-50%);
    font-family:var(--mono); font-size:12px; color:#8f887a; white-space:nowrap; }
  .speaker{
    width:64px; height:110px; border-radius:8px; align-self:center;
    background:
      radial-gradient(circle at center, #0a0a0c 1.3px, transparent 1.6px) 0 0/9px 9px,
      linear-gradient(#141410,#0b0b09);
    box-shadow:inset 0 0 8px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.05);
    border:1px solid #000;
  }

  /* feet */
  .tv .foot{ position:absolute; bottom:-14px; width:70px; height:16px; border-radius:0 0 8px 8px;
    background:linear-gradient(#0f0e0c,#050504); box-shadow:0 8px 14px rgba(0,0,0,.6); }
  .tv .foot.l{ left:16%; transform:skewX(14deg) } .tv .foot.r{ right:16%; transform:skewX(-14deg) }

  /* ---------------- REMOTE ---------------- */
  .remote{
    width:172px; flex:0 0 auto;
    background:linear-gradient(160deg,#2a2a30,#141418 75%);
    border-radius:26px 26px 30px 30px;
    padding:18px 16px 22px;
    box-shadow:inset 0 2px 0 rgba(255,255,255,.06), 0 26px 40px -14px rgba(0,0,0,.85), 0 0 0 1px #000;
    display:flex; flex-direction:column; gap:12px;
    align-self:center;
  }
  .remote .rlabel{ text-align:center; font-family:var(--mono); font-size:13px; letter-spacing:2px; color:#7d7d86; }
  .remote .pow{
    align-self:center; width:52px; height:52px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#5a1414,#2a0a0a 70%);
    border:1px solid #000; color:#ff9a9a; font-size:22px; cursor:pointer;
    box-shadow:0 4px 8px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.15);
    transition:transform .06s, box-shadow .2s;
  }
  .remote .row{ display:flex; gap:10px; }
  .remote .rocker{ flex:1; display:flex; flex-direction:column; border-radius:22px; overflow:hidden;
    background:#0e0e12; box-shadow:inset 0 0 0 1px #000; }
  .remote .rocker .cap{ text-align:center; font-family:var(--mono); font-size:11px; color:#6f6f78; padding:2px 0; }
  .btn{
    background:linear-gradient(#33333a,#1c1c22); color:#d7d7dd; border:none; cursor:pointer;
    font-family:var(--mono); font-size:19px; border-radius:12px; padding:9px 0;
    box-shadow:0 2px 3px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.07);
    transition:transform .06s, filter .1s; touch-action:manipulation;
  }
  .btn:hover{ filter:brightness(1.18) }
  .btn.press,.remote .pow.press{ transform:translateY(2px) scale(.97); filter:brightness(1.35) }
  .rocker .btn{ border-radius:0; box-shadow:inset 0 1px 0 rgba(255,255,255,.05); font-size:22px; }
  .pad{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
  .pad .btn{ aspect-ratio:1; font-size:20px; }
  .remote .util{ display:flex; gap:9px; }
  .remote .util .btn{ flex:1; font-size:14px; }

  .hint{
    position:fixed; left:0; right:0; bottom:12px; z-index:3; text-align:center;
    font-family:var(--mono); font-size:15px; color:rgba(180,190,200,.45); letter-spacing:1px;
    pointer-events:none; transition:opacity .5s;
  }
  .hint b{ color:var(--cyan); font-weight:400 }

  @media (max-width:820px){
    .stage{ flex-direction:column; gap:20px; }
    .tv{ width:min(94vw, 60vh*1.34); grid-template-columns:1fr 60px; padding:16px; }
    .panel .brand{ font-size:10px }
    .knob{ width:34px;height:34px } .knob .cap{ font-size:10px }
    .speaker{ width:44px; height:74px }
    .remote{ width:min(92vw,300px); flex-direction:row; flex-wrap:wrap; justify-content:center; align-items:flex-start; }
    .remote .rlabel{ width:100%; }
    .remote .pow{ order:-1 }
    .pad{ width:150px }
  }
  @media (prefers-reduced-motion:reduce){
    .fx-roll,.fx-flicker{ animation:none !important; opacity:.2 }
    #tube{ transition:none }
  }
</style>
</head>
<body>
<div id="ambient"></div>

<div class="stage">
  <!-- TV -->
  <div class="tv" id="tv">
    <span class="foot l"></span><span class="foot r"></span>
    <div class="screen-wrap">
      <div class="screen" id="screen">
        <canvas id="tube" width="640" height="480"></canvas>
        <div class="fx-scan"></div>
        <div class="fx-mask"></div>
        <div class="fx-roll"></div>
        <div class="fx-flicker"></div>
        <div class="fx-glass"></div>

        <div class="standby">
          <div class="p">◾ STANDBY ◾<br><span class="blink">Taste drücken zum Einschalten</span></div>
        </div>

        <div class="osd">
          <div class="chan" id="osdChan"><span class="num">1</span><span class="name">SENDER</span></div>
          <div class="entry" id="osdEntry"></div>
          <div class="clock" id="osdClock">00:00</div>
          <div class="vol" id="osdVol"><span class="lab">VOL</span><div class="bars" id="volBars"></div></div>
          <div class="mute" id="osdMute">🔇 STUMM</div>
        </div>

        <div class="guide" id="guide">
          <h3>◈ PROGRAMM ◈</h3>
          <div class="rows" id="guideRows"></div>
        </div>

        <div class="fx-power"><div class="line"></div></div>
      </div>
    </div>

    <div class="panel">
      <div class="brand">RÖHRE&nbsp;·&nbsp;VT-88</div>
      <div class="knobs">
        <div class="knob" id="knobChan" title="Sender"><span class="cap">CH</span></div>
        <div class="knob" id="knobVol" title="Lautstärke"><span class="cap">VOL</span></div>
      </div>
      <div class="speaker"></div>
      <div class="led" id="led"></div>
    </div>
  </div>

  <!-- REMOTE -->
  <div class="remote" id="remote">
    <div class="rlabel">◉ VT-88 ◉</div>
    <button class="pow" data-act="power" title="Ein/Aus">⏻</button>
    <div class="row">
      <div class="rocker">
        <button class="btn" data-act="chup">▲</button>
        <div class="cap">CH</div>
        <button class="btn" data-act="chdn">▼</button>
      </div>
      <div class="rocker">
        <button class="btn" data-act="volup">＋</button>
        <div class="cap">VOL</div>
        <button class="btn" data-act="voldn">－</button>
      </div>
    </div>
    <div class="pad">
      <button class="btn" data-digit="1">1</button>
      <button class="btn" data-digit="2">2</button>
      <button class="btn" data-digit="3">3</button>
      <button class="btn" data-digit="4">4</button>
      <button class="btn" data-digit="5">5</button>
      <button class="btn" data-digit="6">6</button>
      <button class="btn" data-digit="7">7</button>
      <button class="btn" data-digit="8">8</button>
      <button class="btn" data-digit="9">9</button>
      <button class="btn" data-act="mute">🔇</button>
      <button class="btn" data-digit="0">0</button>
      <button class="btn" data-act="guide">☰</button>
    </div>
    <div class="util">
      <button class="btn" data-act="guide">GUIDE</button>
      <button class="btn" data-act="full">⛶</button>
    </div>
  </div>
</div>

<div class="hint" id="hint">
  <b>Taste</b> = Ein &nbsp;·&nbsp; <b>↑↓</b> Sender &nbsp;·&nbsp; <b>←→</b> Lautstärke &nbsp;·&nbsp; <b>0–9</b> Sendernummer &nbsp;·&nbsp; <b>G</b> Programm &nbsp;·&nbsp; <b>M</b> Stumm
</div>

<script>
"use strict";
(function(){
  const CW = 640, CH = 480;
  const cv = document.getElementById('tube');
  const ctx = cv.getContext('2d', { alpha:false });
  const screen = document.getElementById('screen');
  const tvEl = document.getElementById('tv');
  const ambient = document.getElementById('ambient');
  const led = document.getElementById('led');

  // offscreen for static
  const sc = document.createElement('canvas'); sc.width=180; sc.height=135;
  const sctx = sc.getContext('2d');
  const simg = sctx.createImageData(sc.width, sc.height);

  /* ================= AUDIO ENGINE ================= */
  const Audio = (function(){
    let actx=null, master=null, noiseGain=null, noiseSrc=null, hum=null, humGain=null;
    let toneOsc=null, toneGain=null;
    let musicOn=false, analyser=null, musicGain=null, seqTimer=null, step=0;
    let vol=0.7, muted=false;
    let started=false;

    function ensure(){
      if(actx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      actx = new AC();
      master = actx.createGain(); master.gain.value = 0; master.connect(actx.destination);

      // white noise loop
      const buf = actx.createBuffer(1, actx.sampleRate*2, actx.sampleRate);
      const d = buf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
      noiseSrc = actx.createBufferSource(); noiseSrc.buffer = buf; noiseSrc.loop = true;
      noiseGain = actx.createGain(); noiseGain.gain.value = 0;
      const nf = actx.createBiquadFilter(); nf.type='highpass'; nf.frequency.value=1400;
      noiseSrc.connect(nf); nf.connect(noiseGain); noiseGain.connect(master);
      noiseSrc.start();

      // low mains hum baseline
      hum = actx.createOscillator(); hum.type='sawtooth'; hum.frequency.value=60;
      humGain = actx.createGain(); humGain.gain.value=0;
      const hf = actx.createBiquadFilter(); hf.type='lowpass'; hf.frequency.value=120;

    function resume(){ if(actx && actx.state==='suspended') actx.resume(); }
    function applyMaster(on){
      if(!master) return;

      power(on){ if(!actx) return; applyMaster(on); if(!on){ this.stopMusic(); this.stopTone(); this.setStatic(0);} },
      setVol(v){ vol=v; if(actx) applyMaster(true); },

        const t=actx.currentTime; g.gain.setValueAtTime(0.12,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.09);
        o.start(t); o.stop(t+0.1); },

      startTone(){ if(!actx||toneOsc) return; toneOsc=actx.createOscillator(); toneGain=actx.createGain();
        toneOsc.type='sine'; toneOsc.frequency.value=1000; toneGain.gain.value=0.0001;
        toneOsc.connect(toneGain); toneGain.connect(master); toneOsc.start();
        toneGain.gain.setTargetAtTime(0.08, actx.currentTime, 0.05); },

      startMusic(){ if(!actx||musicOn) return; musicOn=true;
        musicGain.gain.setTargetAtTime(0.9, actx.currentTime, 0.1); step=0;
        const scale=[0,3,5,7,10,12,15]; const root=196; // G3
        const bassSeq=[0,0,5,7]; let bar=0;
        const tick=()=>{
          if(!musicOn) return;

          const deg=scale[(step*2)%scale.length];

      this.birds.forEach(b=>{ b.x+=b.s*0.016; const fl=Math.sin(t*8+b.x*0.1)*6;
        ctx.strokeStyle='rgba(20,30,40,.8)'; ctx.lineWidth=2; ctx.beginPath();
        ctx.moveTo(b.x-8,b.y+fl); ctx.lineTo(b.x,b.y); ctx.lineTo(b.x+8,b.y+fl); ctx.stroke(); });
      this.birds=this.birds.filter(b=>b.x<CW+30);
      // caption
      const cap=Math.sin(t*0.3)>-0.2;
      if(cap){ ctx.fillStyle='rgba(0,0,0,.4)'; ctx.fillRect(0,420,CW,60);
        txt('TERRA · Der lebendige Planet',24,452,30,'#eafff0','left',"'Oswald',sans-serif",6);
        txt('Folge 3 — Das stille Tal',24,474,20,'rgba(220,255,230,.7)','left'); }
      function layer(base,col,amp,ph){ ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(0,CH);
        for(let x=0;x<=CW;x+=20){ const y=base - Math.sin(x*0.01+ph*0.02)*20*amp - ((x*7)%40)*0.3*amp; ctx.lineTo(x,y); }
        ctx.lineTo(CW,CH); ctx.closePath(); ctx.fill(); }
      function tree(x,y,h){ ctx.fillStyle='#132a1a'; ctx.beginPath();
        ctx.moveTo(x,y-h*2.2); ctx.lineTo(x-h*0.7,y); ctx.lineTo(x+h*0.7,y); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(x,y-h*2.8); ctx.lineTo(x-h*0.55,y-h*0.9); ctx.lineTo(x+h*0.55,y-h*0.9); ctx.closePath(); ctx.fill(); }
    }};

  // 7 — CARTOON
  channels[7] = { name:'TOON!', glow:'#ffd23f', ball:{y:0,vy:0,x:0},
    draw(t,dt){
      dt=Math.min(dt||0.016,0.033);
      const g=ctx.createLinearGradient(0,0,0,CH); g.addColorStop(0,'#8ed0ff'); g.addColorStop(1,'#d6f0ff');
      ctx.fillStyle=g; ctx.fillRect(0,0,CW,CH);
      // sun with face
      ctx.fillStyle='#ffd23f'; ctx.shadowColor='#ffd23f'; ctx.shadowBlur=30;
      ctx.beginPath(); ctx.arc(CW-90,80,50,0,7); ctx.fill(); ctx.shadowBlur=0;
      ctx.fillStyle='#c98a00'; ctx.beginPath(); ctx.arc(CW-108,72,6,0,7); ctx.arc(CW-72,72,6,0,7); ctx.fill();
      ctx.strokeStyle='#c98a00'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(CW-90,88,16,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
      // clouds
      for(let i=0;i<3;i++){ const x=(i*230+t*18)%(CW+140)-70; cloudy(x,70+i*30); }
      // ground
      ctx.fillStyle='#7ec850'; ctx.beginPath(); ctx.moveTo(0,380);
      for(let x=0;x<=CW;x+=30) ctx.lineTo(x,380+Math.sin(x*0.05)*8); ctx.lineTo(CW,CH); ctx.lineTo(0,CH); ctx.fill();
      // bouncing character
      const b=this.ball; b.vy+=1400*dt; b.y+=b.vy*dt;
      const floor=330; if(b.y>floor){ b.y=floor; b.vy=-720; }
      const sq=Math.max(0,Math.min(1,(b.vy>0? (b.y-floor+120)/120 :0)));
      const cx=CW/2+Math.sin(t*0.8)*120; const cy=b.y;
      const scaleY=1 - (floor-b.y<40 && b.vy>0?0.25:0); const scaleX=1+(1-scaleY);
      ctx.save(); ctx.translate(cx,cy); ctx.scale(scaleX,scaleY);
      ctx.fillStyle='#ff5a8a'; ctx.beginPath(); ctx.arc(0,0,50,0,7); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-16,-8,14,0,7); ctx.arc(18,-8,14,0,7); ctx.fill();
      ctx.fillStyle='#222'; const lookx=Math.sin(t*0.8)*4; ctx.beginPath(); ctx.arc(-16+lookx,-6,6,0,7); ctx.arc(18+lookx,-6,6,0,7); ctx.fill();
      ctx.strokeStyle='#a00'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(0,10,20,0.1*Math.PI,0.9*Math.PI); ctx.stroke();
      // cheeks
      ctx.fillStyle='rgba(255,120,150,.6)'; ctx.beginPath(); ctx.arc(-30,10,8,0,7); ctx.arc(30,10,8,0,7); ctx.fill();
      ctx.restore();
      // shadow
      ctx.fillStyle='rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(cx,floor+52,40*(1+(floor-b.y)/300),10,0,0,7); ctx.fill();
      // wobble title
      const wob=Math.sin(t*3)*0.06;
      ctx.save(); ctx.translate(CW/2,70); ctx.rotate(wob);
      txt('TOON TIME!',0,0,58,'#ff2e7e','center',"'Oswald',sans-serif",0);
      ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.strokeText? ctx.strokeText('TOON TIME!',0,0):0;
      ctx.restore();
      function cloudy(x,y){ ctx.fillStyle='#fff'; ctx.beginPath();
        ctx.arc(x,y,22,0,7); ctx.arc(x+26,y+6,18,0,7); ctx.arc(x-24,y+6,16,0,7); ctx.arc(x+4,y+12,20,0,7); ctx.fill(); }
    }};

  // 8 — COSMOS
  channels[8] = { name:'KOSMOS', glow:'#7a5cff', stars:null, facts:[
      'Das Universum ist etwa 13,8 Milliarden Jahre alt.',
      'Ein Löffel Neutronenstern wöge ~4 Milliarden Tonnen.',
      'Es gibt mehr Sterne als Sandkörner auf der Erde.',
      'Licht der Sonne braucht 8 Minuten bis zu dir.'],
    f:0,fT:0,
    draw(t,dt){
      dt=Math.min(dt||0.016,0.033);
      if(!this.stars){ this.stars=[]; for(let i=0;i<160;i++) this.stars.push(res()); }
      function res(){ return {x:(Math.random()*2-1),y:(Math.random()*2-1),z:Math.random()}; }
      ctx.fillStyle='#03030a'; ctx.fillRect(0,0,CW,CH);
      // nebula
      const nb=ctx.createRadialGradient(CW/2,CH/2,20,CW/2,CH/2,340);
      nb.addColorStop(0,'rgba(90,60,200,.20)'); nb.addColorStop(0.5,'rgba(200,60,160,.10)'); nb.addColorStop(1,'transparent');
      ctx.fillStyle=nb; ctx.fillRect(0,0,CW,CH);
      // warp stars
      this.stars.forEach(s=>{ s.z-=dt*0.35; if(s.z<=0.02){ Object.assign(s,res()); s.z=1; }
        const px=CW/2 + (s.x/s.z)*CW*0.5; const py=CH/2 + (s.y/s.z)*CH*0.5;
        const px2=CW/2 + (s.x/(s.z+dt*0.35))*CW*0.5; const py2=CH/2 + (s.y/(s.z+dt*0.35))*CH*0.5;
        const r=(1-s.z)*2.4; ctx.strokeStyle='rgba(255,255,255,'+(1-s.z)+')'; ctx.lineWidth=r;
        ctx.beginPath(); ctx.moveTo(px2,py2); ctx.lineTo(px,py); ctx.stroke(); });
      // planet
      ctx.save(); ctx.translate(150,330);
      const pg=ctx.createRadialGradient(-18,-18,10,0,0,60);
      pg.addColorStop(0,'#a98bff'); pg.addColorStop(1,'#2a1a66'); ctx.fillStyle=pg;
      ctx.beginPath(); ctx.arc(0,0,54,0,7); ctx.fill();
      ctx.strokeStyle='rgba(180,150,255,.5)'; ctx.lineWidth=6; ctx.save(); ctx.rotate(-0.5); ctx.scale(1,0.3);
      ctx.beginPath(); ctx.arc(0,0,80,0,7); ctx.stroke(); ctx.restore(); ctx.restore();
      // caption
      if(t-this.fT>7){ this.f=(this.f+1)%this.facts.length; this.fT=t; }
      txt('◈ KOSMOS ◈',CW/2,60,40,'#b9a6ff','center',"'Oswald',sans-serif",12);
      ctx.fillStyle='rgba(10,6,30,.55)'; ctx.fillRect(0,418,CW,62);
      txt(this.facts[this.f],CW/2,456,26,'#dcd2ff','center',null,4);
    }};

  const NUMS = Object.keys(channels).map(Number).sort((a,b)=>a-b);

  function mix(a,b,t){ // hex mix
    const pa=hx(a), pb=hx(b);
    return `rgb(${r(pa[0],pb[0])},${r(pa[1],pb[1])},${r(pa[2],pb[2])})`;
    function r(x,y){ return Math.round(x+(y-x)*t); }
  }
  function hx(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
  function clockStr(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

  /* ================= STATE ================= */
  const S = { power:false, chan:NUMS[0], mode:'off', tuneUntil:0, tuneFrom:0, entry:'', entryUntil:0, transitioning:false };
  let lastT = performance.now();

  const osdChan=document.getElementById('osdChan'), osdEntry=document.getElementById('osdEntry'),
        osdClock=document.getElementById('osdClock'), osdVol=document.getElementById('osdVol'),
        volBars=document.getElementById('volBars'), osdMute=document.getElementById('osdMute'),
        guide=document.getElementById('guide'), guideRows=document.getElementById('guideRows');
  let volN=8; // 0..10
  // build vol bars
  for(let i=0;i<10;i++){ const b=document.createElement('i'); volBars.appendChild(b); }
  Audio.setVol(volN/10);

  function setGlow(hex){ document.documentElement.style.setProperty('--glow',hex); }

  function showChanOSD(){
    const c=channels[S.chan];
    osdChan.querySelector('.num').textContent=S.chan;
    osdChan.querySelector('.name').textContent = c? c.name : 'KEIN SIGNAL';
    osdChan.classList.add('show'); osdClock.textContent=clockStr(); osdClock.classList.add('show');
    clearTimeout(showChanOSD._t); showChanOSD._t=setTimeout(()=>{ osdChan.classList.remove('show'); osdClock.classList.remove('show'); },3500);
  }
  function showVolOSD(){
    osdVol.classList.add('show');
    [...volBars.children].forEach((b,i)=> b.classList.toggle('f', i<volN));
    clearTimeout(showVolOSD._t); showVolOSD._t=setTimeout(()=>osdVol.classList.remove('show'),1800);
  }
  function updateMute(){ osdMute.classList.toggle('show', Audio.isMuted() && S.power); }

  function buildGuide(){
    guideRows.innerHTML='';
    NUMS.forEach(n=>{ const c=channels[n];
      const row=document.createElement('div'); row.className='row'+(n===S.chan?' cur':'');
      row.innerHTML=`<span class="n">${String(n).padStart(2,'0')}</span><span class="nm">${c.name}</span><span class="now">${c.music?'♪ Musik':c.tone?'Testton':'jetzt live'}</span>`;
      guideRows.appendChild(row); });
  }
  let guideOn=false;
  function toggleGuide(force){
    guideOn = force!=null?force:!guideOn;
    if(guideOn && S.power){ buildGuide(); guide.classList.add('show'); Audio.blip();
      clearTimeout(toggleGuide._t); toggleGuide._t=setTimeout(()=>toggleGuide(false),6000); }
    else { guide.classList.remove('show'); guideOn=false; }
  }

  /* ================= POWER ================= */
  function powerOn(){
    if(S.power) return;
    S.power=true; S.mode='tuning'; S.tuneUntil=performance.now()+1200; S.tuneFrom=performance.now();
    Audio.start(true); Audio.click(); Audio.setStatic(0.25);
    led.classList.add('on'); tvEl.classList.add('warm'); ambient.classList.add('on');
    screen.classList.remove('turning-off'); void screen.offsetWidth;
    screen.classList.add('turning-on','lit');
    setGlow(channels[S.chan]?channels[S.chan].glow:'#888');
    document.getElementById('hint').style.opacity=0;
    setTimeout(()=>screen.classList.remove('turning-on'),600);
    setTimeout(()=>{ S.mode='play'; Audio.setStatic(0); tuneAudio(); showChanOSD(); },1200);
  }
  function powerOff(){
    if(!S.power) return;
    S.power=false; S.mode='off'; Audio.click(); Audio.power(false);
    led.classList.remove('on'); tvEl.classList.remove('warm'); ambient.classList.remove('on');
    toggleGuide(false);
    screen.classList.remove('turning-on');
    screen.classList.add('turning-off');
    setTimeout(()=>{ screen.classList.remove('lit','turning-off'); ctx.fillStyle='#000'; ctx.fillRect(0,0,CW,CH); },460);
    document.getElementById('hint').style.opacity='';
  }
  function togglePower(){ S.power?powerOff():powerOn(); }

  function tuneAudio(){
    const c=channels[S.chan];
    Audio.stopTone(); Audio.stopMusic();
    if(!c){ Audio.setStatic(0.5); return; }
    Audio.setStatic(0);
    if(c.tone) Audio.startTone();
    if(c.music) Audio.startMusic();
  }

  function tuneTo(n){
    if(!S.power) return;
    S.chan=n; S.mode='tuning'; S.tuneUntil=performance.now()+420; S.transitioning=true;
    Audio.click(); Audio.setStatic(0.45);
    setGlow(channels[n]?channels[n].glow:'#777');
    if(channels[n]&&channels[n].st) channels[n].st=null; // reset arcade
    setTimeout(()=>{ if(!S.power) return; S.mode='play'; S.transitioning=false; Audio.setStatic(0); tuneAudio(); showChanOSD(); if(guideOn) buildGuide(); }, 420);
  }
  function chanStep(dir){
    const i=NUMS.indexOf(S.chan); let ni=(i+dir+NUMS.length)%NUMS.length;
    tuneTo(NUMS[ni]);
  }
  function enterDigit(d){
    if(!S.power) return;
    S.entry += d; if(S.entry.length>2) S.entry=d;
    osdEntry.textContent=S.entry+'_'; osdEntry.classList.add('show');
    Audio.blip();
    clearTimeout(enterDigit._t);
    enterDigit._t=setTimeout(()=>{
      osdEntry.classList.remove('show');
      const n=parseInt(S.entry,10); S.entry='';
      if(!isNaN(n)){ if(channels[n]) tuneTo(n); else tuneToInvalid(n); }
    }, 1100);
  }
  function tuneToInvalid(n){
    S.chan=n; S.mode='nosignal'; S.transitioning=false;
    Audio.click(); Audio.setStatic(0.5); setGlow('#555');
    Audio.stopTone(); Audio.stopMusic();
    showChanOSD();
  }
  function setVol(dir){
    if(!S.power) return;
    volN=Math.max(0,Math.min(10,volN+dir)); Audio.setVol(volN/10);
    if(Audio.isMuted() && volN>0){ Audio.setMuted(false); updateMute(); }
    Audio.blip(); showVolOSD();
  }
  function toggleMute(){ if(!S.power) return; Audio.setMuted(!Audio.isMuted()); updateMute(); showVolOSD(); }

  /* ================= RENDER LOOP ================= */
  function frame(now){
    const dt=(now-lastT)/1000; lastT=now;
    const t=now/1000;
    if(S.power && screen.classList.contains('lit')){
      if(S.mode==='tuning'){
        drawStatic(1);
        // brief signal flash
      } else if(S.mode==='nosignal'){
        drawStatic(1);
        // NO SIGNAL box
        ctx.fillStyle='rgba(0,0,0,.6)'; rr(CW/2-150,CH/2-45,300,90,10); ctx.fill();
        ctx.strokeStyle='#fff'; ctx.lineWidth=3; rr(CW/2-150,CH/2-45,300,90,10); ctx.stroke();
        txt('KEIN SIGNAL',CW/2,CH/2+4,44,'#fff','center',null,0);
        txt('CH '+String(S.chan).padStart(2,'0'),CW/2,CH/2+34,22,'#aaa','center');
      } else {
        const c=channels[S.chan];
        if(c){ try{ c.draw(t,dt);}catch(e){ drawStatic(1); } }
        else drawStatic(1);
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // keep clock fresh on OSD
  setInterval(()=>{ if(osdClock.classList.contains('show')) osdClock.textContent=clockStr(); },10000);

  /* ================= INPUT ================= */
  window.addEventListener('keydown',(e)=>{
    const k=e.key;
    if(!S.power){
      // any key powers on (ignore pure modifiers)
      if(['Shift','Control','Alt','Meta','Tab','CapsLock'].includes(k)) return;
      e.preventDefault(); powerOn(); return;
    }
    if(k>='0' && k<='9'){ e.preventDefault(); enterDigit(k); return; }
    switch(k){
      case 'ArrowUp': e.preventDefault(); chanStep(1); break;
      case 'ArrowDown': e.preventDefault(); chanStep(-1); break;
      case 'ArrowRight': e.preventDefault(); setVol(1); break;
      case 'ArrowLeft': e.preventDefault(); setVol(-1); break;
      case '+': case '=': setVol(1); break;
      case '-': case '_': setVol(-1); break;
      case 'm': case 'M': toggleMute(); break;
      case 'g': case 'G': toggleGuide(); break;
      case 'p': case 'P': togglePower(); break;
      case 'f': case 'F': toggleFull(); break;
      case 'Enter': if(S.entry){ /* immediate confirm */ clearTimeout(enterDigit._t);
        const n=parseInt(S.entry,10); S.entry=''; osdEntry.classList.remove('show');
        if(channels[n]) tuneTo(n); else tuneToInvalid(n); } break;
      case ' ': e.preventDefault(); toggleGuide(); break;
      case 'Escape': toggleGuide(false); break;
    }
  });

  // remote / knob clicks
  function act(a){
    switch(a){
      case 'power': togglePower(); break;
      case 'chup': chanStep(1); break;
      case 'chdn': chanStep(-1); break;
      case 'volup': setVol(1); break;
      case 'voldn': setVol(-1); break;
      case 'mute': toggleMute(); break;
      case 'guide': toggleGuide(); break;
      case 'full': toggleFull(); break;
    }
  }
  document.getElementById('remote').addEventListener('click',(e)=>{
    const b=e.target.closest('[data-act],[data-digit]'); if(!b) return;
    b.classList.add('press'); setTimeout(()=>b.classList.remove('press'),110);
    if(b.dataset.digit!=null){ if(!S.power){ powerOn(); } else enterDigit(b.dataset.digit); return; }
    if(b.dataset.act==='power'){ togglePower(); return; }
    if(!S.power && b.dataset.act){ powerOn(); return; }
    act(b.dataset.act);
  });
  // knobs
  document.getElementById('knobChan').addEventListener('click',()=>{ S.power?chanStep(1):powerOn(); });
  document.getElementById('knobVol').addEventListener('click',()=>{ S.power?setVol(1):powerOn(); });
  document.getElementById('knobVol').addEventListener('contextmenu',(e)=>{e.preventDefault(); if(S.power)setVol(-1);});
  document.getElementById('knobChan').addEventListener('contextmenu',(e)=>{e.preventDefault(); if(S.power)chanStep(-1);});

  function toggleFull(){
    const el=document.documentElement;
    if(!document.fullscreenElement){ (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el); }
    else { (document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document); }
  }

  // initial idle screen: faint static ghost behind standby? keep black.
  ctx.fillStyle='#000'; ctx.fillRect(0,0,CW,CH);
})();
</script>
</body>
